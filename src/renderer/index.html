<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- img-src 'self' data: -- added 2026-08-28 for real tab favicons
         (src/main/favicon.ts). Deliberately NOT https: -- favicons are
         fetched and re-encoded to data: URLs in main, so this privileged
         view still makes zero network requests of its own; see
         favicon.ts's header for the full reasoning. crx: -- added for the
         toolbar's extension icons (ADR-0043): <browser-action-list>'s own
         icon <img> requests go through the crx: scheme's handler
         (src/main/pages/internal-session.ts registers it), img-src only. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: crx:"
    />
    <title>Orivon</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Chrome view only: no page content ever renders here (src/main/window.ts).
         Three rows -- tab strip, toolbar, bookmarks bar -- restyled 2026-08-28
         to match orivon-browser-v2 (visual reference only, ADR-0002;
         src/renderer/README.md). Only #tabrow drags (.drag below); every
         clickable element inside it is marked .no-drag explicitly, same
         rule the prior version of this file claimed but never wrote --
         see git history if that claim resurfaces without the class to
         back it up. -->
    <div id="tabrow" class="tabrow drag" role="tablist">
      <button id="new-tab" class="newtabbtn no-drag" type="button" aria-label="New tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <path d="M5 12h14" /><path d="M12 5v14" />
        </svg>
      </button>
    </div>

    <div id="toolbar" class="toolbar">
      <div class="navgroup">
        <button id="back" class="navbtn" type="button" aria-label="Back" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <button id="forward" class="navbtn" type="button" aria-label="Forward" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
        <button id="reload" class="navbtn" type="button" aria-label="Reload">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
      </div>

      <button id="bookmark-toggle" class="navbtn bookmarkbtn" type="button" aria-label="Bookmark this page" aria-pressed="false" title="Bookmark this page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
        </svg>
      </button>

      <form id="address-form" class="addressbar-form">
        <div id="address-pill" class="addressbar-pill">
          <div class="addressbar-leading">
            <!-- The Web3 Score shield: its outline takes the site's Website
                 level colour (red/orange/yellow/green), grey until one is
                 known -- see web3-shield.ts, which main.ts paints this
                 button's content through. Clickable: opens the site-info
                 popup straight to the Web3 Score page. -->
            <button id="web3-score-btn" class="pillbtn" type="button" title="Web3 Score" aria-label="Web3 Score"></button>
            <!-- The site-info popup's other entry point: this site's own
                 permission switches. Hidden until main.ts's siteSummaryFor
                 says the site has asked for something -- an ordinary
                 website carries no key at all, the same way Chrome's own
                 permission icon stays absent until a site has asked. -->
            <button id="site-permissions-btn" class="pillbtn" type="button" hidden title="Permissions" aria-label="Permissions">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z" />
                <circle cx="16.5" cy="7.5" r=".5" fill="currentColor" />
              </svg>
            </button>
          </div>
          <input
            id="address"
            class="addressbar"
            type="text"
            autocomplete="off"
            spellcheck="false"
            aria-label="Address bar"
            placeholder="Search or enter address"
          />
          <div class="addressbar-trailing">
            <!-- The page's zoom, when it is not the default. Choosing it puts the page back to actual size. -->
            <button id="zoom-chip" class="zoom-chip" type="button" hidden title="Zoom: click for actual size"></button>
            <!-- The same level as a word: Web2, Web2.5 or Web3. Hidden
                 until a level is known (web3-shield.ts's paintMark). -->
            <span id="web3-mark" class="web3-mark" hidden></span>
          </div>
        </div>
      </form>

      <div class="toolbar-cluster">
        <span class="sep" aria-hidden="true"></span>
        <!-- The all-sites popup: every app, all its grants, revoke-only --
             see src/main/permissions/permissions-panel.ts. A tune icon,
             never a key: the key now lives in the pill and means THIS
             site only. -->
        <button id="permissions-btn" class="iconbtn" type="button" title="All sites' permissions" aria-label="All sites' permissions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="6" x2="20" y2="6" /><circle cx="14" cy="6" r="2" fill="currentColor" />
            <line x1="4" y1="12" x2="20" y2="12" /><circle cx="8" cy="12" r="2" fill="currentColor" />
            <line x1="4" y1="18" x2="20" y2="18" /><circle cx="16" cy="18" r="2" fill="currentColor" />
          </svg>
        </button>
        <!-- One button per extension with a browser action (ADR-0043); shows
             nothing when none has one. `partition` addresses the session
             every extension runs in (src/main/extensions/extension-host.ts's
             EXTENSIONS_DEFAULT_PARTITION, its partition.ts resolver maps it
             to session.defaultSession) -- defined by src/preload/shell.ts's
             injectBrowserAction(), after its own URL gate passes. -->
        <browser-action-list partition="orivon-extensions-default" alignment="right" aria-label="Extensions"></browser-action-list>
        <button class="iconbtn" type="button" disabled title="Sidebar — not in v0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="18" height="18" x="3" y="3" rx="2" /><path d="M15 3v18" />
          </svg>
        </button>
        <button id="identity" class="iconbtn" type="button" disabled title="Identity — not in v0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" />
            <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
          </svg>
        </button>
        <button class="iconbtn" type="button" disabled title="Favorites — not in v0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" />
          </svg>
        </button>
        <span class="statusdot" aria-hidden="true" title="Node status — not in v0"></span>
        <!-- Which profile this window is, once there is more than one, and always in a private window. Opens the page that manages them. -->
        <button id="profile-chip" class="profile-chip" type="button" hidden></button>
        <button id="menu" class="iconbtn" type="button" title="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M3 5h18" /><path d="M3 12h18" /><path d="M3 19h18" />
          </svg>
        </button>
      </div>
    </div>

    <div id="bookmarks-bar" class="bookmarksbar" role="toolbar" aria-label="Bookmarks">
      <div id="bookmarks-list" class="bmlist"></div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
