<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Among the tightest CSPs in this codebase: no network requests of its
         own (connect-src 'none' -- navigation goes through
         orivonNewTab.navigate() over IPC, never a raw form submission or
         fetch), and images only from the page's own bundle, as data: URLs
         (the bookmarks' icons and the featured apps' own) or as a blob: URL the page made itself from the bytes main
         handed it (the picture the person chose for the background). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'"
    />
    <title>New Tab</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Ordinary tab content (src/main/tabs.ts's createTab(), a
         genuinely fresh tab) -- not the privileged chrome view. Owner
         override, 2026-08-28: real content only, as a grid
         of bookmark and app tiles, with no Wallet, App-Store or Network widgets,
         none of which exist in this repository. See
         src/renderer/README.md. -->
    <main class="dashboard">
      <div class="brand">
        <span class="mark" role="img" aria-label="Orivon"></span>
        <h1 class="wordmark">Orivon</h1>
      </div>

      <form id="search-form" class="search-form">
        <input
          id="search-input"
          class="search-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search or enter address"
          aria-label="Search or enter address"
        />
      </form>

      <section id="featured-section" class="tile-section">
        <h2 class="tile-section-title">Orivon Featured</h2>
        <div id="featured-grid" class="tile-grid"></div>
        <button id="featured-show-hidden" class="link-button" type="button" hidden></button>
      </section>

      <section id="bookmarks-section" class="tile-section" hidden>
        <h2 class="tile-section-title">Bookmarks</h2>
        <div id="bookmarks-grid" class="tile-grid"></div>
      </section>
    </main>

    <button id="report-bug" class="report-bug" type="button" title="Report a bug" hidden>Report a bug</button>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
