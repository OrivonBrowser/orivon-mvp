<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tightest CSP in this codebase: no image loading, no network
         requests of its own (connect-src 'none' -- navigation goes
         through orivonNewTab.navigate() over IPC, never a raw form
         submission or fetch), nothing beyond this page's own script and
         inline styles. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'"
    />
    <title>New Tab</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Ordinary tab content (src/main/tabs.ts's createTab(), a
         genuinely fresh tab) -- not the privileged chrome view. Owner
         override, 2026-08-28: real content only, matching the vision's
         grid LAYOUT (docs.orivonstack.com/docs/implementations/
         dashboard-app) without its Wallet/App-Store/Network widgets,
         none of which exist in this repository. See
         src/renderer/README.md. -->
    <main class="dashboard">
      <div class="brand">
        <span class="mark" aria-hidden="true">O</span>
        <h1 class="wordmark">Orivon</h1>
      </div>

      <form id="search-form" class="search-form">
        <input
          id="search-input"
          class="search-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search or enter address"
          aria-label="Search or enter address"
        />
      </form>

      <section class="tile-section">
        <h2 class="tile-section-title">Apps</h2>
        <div class="tile-grid">
          <!-- Both real, planned apps for this MVP (mvp-scope.md IN
               table) -- neither is built yet (build steps 5 and 7), so
               both are disabled with an honest title, the same pattern
               already shipped for the toolbar's inert icons
               (open-questions.md A25). -->
          <button class="tile" type="button" disabled title="Torrent streaming — not built yet (build step 5)">
            <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 15V3" /><path d="m7 10 5 5 5-5" /><path d="M2 17v3a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3" />
            </svg>
            <span class="tile-label">Torrent</span>
          </button>
          <button class="tile" type="button" disabled title="Nostr identity — not built yet (build step 7)">
            <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 11a9 9 0 0 1 9 9" /><path d="M4 4a16 16 0 0 1 16 16" /><circle cx="5" cy="19" r="1" />
            </svg>
            <span class="tile-label">Nostr</span>
          </button>
        </div>
      </section>

      <section id="bookmarks-section" class="tile-section" hidden>
        <h2 class="tile-section-title">Bookmarks</h2>
        <div id="bookmarks-grid" class="tile-grid"></div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
