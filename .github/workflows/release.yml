name: Release

# Packages Orivon for Linux (deb, AppImage), Windows (NSIS installer) and macOS (dmg, Apple
# silicon and Intel), installs or mounts each package and launches it. Publishing a GitHub
# release attaches the packages to it, named by the release tag (v1.2.0 packages as 1.2.0).
# The Windows leg also builds the Microsoft Store package, installs it and launches it with its
# package identity; it is kept as the workflow artifact `store-msix`, never attached to a release.
# A pull request that touches packaging runs the same jobs without publishing. Each release
# also gets an ipfs.json and its CID in its description, and a pinning node puts it on IPFS
# (scripts/pin-releases.sh), and its Windows installer is offered to winget (the winget job).
on:
  release:
    types: [published]
  pull_request:
    paths:
      - electron-builder.yml
      - build/**
      - scripts/smoke-packaged.mjs
      - scripts/pin-releases.sh
      - scripts/install-macos.sh
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  # The oldest light-client checkpoint a release may ship. The app refuses one over 14 days old; this leaves a
  # fresh install a week before that. The scheduled refresh keeps main's checkpoint well inside it.
  MAX_CHECKPOINT_AGE_DAYS: 7
  KUBO_VERSION: v0.43.1
  KUBO_SHA256: 3f2bf974ab2a3ec6d997fac7d8cb46f59983a7cddd0b55ef998e6ce379155fb2
  KOMAC_VERSION: v2.16.0
  KOMAC_SHA256: 7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d

jobs:
  package:
    name: package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            files: |
              release/*.deb
              release/*.AppImage
          - os: windows-latest
            platform: win
            files: release/Orivon-Setup-*.exe
          - os: macos-latest
            platform: mac
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      # The app rejects a light-client checkpoint over 14 days old, so a fresh install of a release
      # shipping one verifies no .eth name. A release refuses one over MAX_CHECKPOINT_AGE_DAYS, so it does
      # not die within days of shipping. refresh-eth-checkpoint.yml keeps main's checkpoint fresh
      # (release-checklist.md).
      - name: The shipped .eth checkpoint is fresh enough
        if: github.event_name == 'release'
        run: >-
          node -e "const c = require('./src/main/verifier/mainnet-checkpoint.json');
          const max = Number(process.env.MAX_CHECKPOINT_AGE_DAYS);
          const days = (Date.now() / 1000 - c.timestamp) / 86400;
          console.log('checkpoint age: ' + days.toFixed(1) + ' days, at most ' + max);
          if (!(days <= max)) { console.error('refresh it: node scripts/refresh-eth-checkpoint.mjs --write'); process.exit(1) }"

      - run: npm ci

      # package.json stays 0.0.0 in git; the release tag is the version a package carries.
      - name: Take the version from the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      # electron-builder skips all macOS signing on a pull request unless told otherwise, and
      # an unsigned arm64 app does not launch. The signature is ad hoc: no secret is involved.
      - name: Package
        env:
          CSC_FOR_PULL_REQUEST: 'true'
        run: npm run package:${{ matrix.platform }}

      # The deb's postinstall loads an AppArmor profile that lets Chromium's sandbox use the user
      # namespaces Ubuntu 24.04 restricts; the AppImage runs as a person runs it, no extra switch.
      - name: Install the deb and launch it, then the AppImage
        if: matrix.platform == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ./release/*.deb
          node scripts/run-headless.mjs node scripts/smoke-packaged.mjs /opt/Orivon/orivon
          chmod +x release/*.AppImage
          node scripts/run-headless.mjs node scripts/smoke-packaged.mjs release/*.AppImage

      - name: Install with the NSIS installer and launch it
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/Orivon-Setup-*.exe | Select-Object -First 1
          # The installer process alone: -Wait would also wait on an app it launched.
          (Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru).WaitForExit()
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Orivon.exe | Select-Object -First 1
          if (-not $exe) { throw "the installer put no Orivon.exe under $env:LOCALAPPDATA\Programs" }
          node scripts/run-headless.mjs node scripts/smoke-packaged.mjs $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The Store signs its package itself, so the one built here is unsigned. To install it on the runner, a
      # COPY is signed with a throwaway certificate whose subject is the manifest's publisher, and trusted for
      # this run only. No secret is involved, and the copy is never uploaded.
      - name: Install the Store package, signed with a throwaway certificate
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $store = Get-ChildItem release/Orivon-Store-*.appx | Select-Object -First 1
          if (-not $store) { throw 'the build wrote no Store package' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($store.FullName)
          try {
            $reader = New-Object System.IO.StreamReader($zip.GetEntry('AppxManifest.xml').Open())
            $manifestText = $reader.ReadToEnd()
            $reader.Dispose()
          } finally { $zip.Dispose() }
          Write-Host $manifestText
          [xml]$manifest = $manifestText
          $identity = $manifest.Package.Identity
          $applicationId = $manifest.Package.Applications.Application.Id

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'the Windows SDK on this runner has no signtool' }

          $plain = [guid]::NewGuid().ToString()
          $secure = ConvertTo-SecureString -String $plain -AsPlainText -Force
          $cert = New-SelfSignedCertificate -Type Custom -Subject $identity.Publisher -KeyUsage DigitalSignature `
            -FriendlyName 'Orivon install test' -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pfx = Join-Path $env:RUNNER_TEMP 'orivon-test.pfx'
          $cer = Join-Path $env:RUNNER_TEMP 'orivon-test.cer'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $secure | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          "STORE_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $signed = Join-Path $env:RUNNER_TEMP 'Orivon-Store-signed-for-test.msix'
          Copy-Item $store.FullName $signed
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $plain $signed
          if ($LASTEXITCODE -ne 0) { throw "signtool exited $LASTEXITCODE" }
          Remove-Item $pfx

          Add-AppxPackage -Path $signed
          $package = Get-AppxPackage -Name $identity.Name
          if (-not $package) { throw "Windows did not register a package named $($identity.Name)" }
          "STORE_NAME=$($identity.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "STORE_PFN=$($package.PackageFamilyName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "STORE_APP_ID=$applicationId" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "installed $($package.PackageFullName) at $($package.InstallLocation)"

      # Started through its AUMID, the only way a Store app gets its package identity: the process Windows
      # starts is the package's own Orivon.exe, and it has to stay up.
      - name: Launch the Store package through its AUMID and keep it running
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-AppxPackage -Name $env:STORE_NAME
          $install = $package.InstallLocation
          function Get-PackageProcesses {
            Get-Process -Name Orivon -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -and $_.Path.StartsWith($install, [StringComparison]::OrdinalIgnoreCase) }
          }
          Start-Process "shell:AppsFolder\${env:STORE_PFN}!${env:STORE_APP_ID}"
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Get-PackageProcesses) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          $started = @(Get-PackageProcesses)
          if ($started.Count -eq 0) { throw "no Orivon.exe from $install is running 90 s after launching $env:STORE_PFN!$env:STORE_APP_ID" }
          Write-Host "running from the package: $($started.Count) process(es), first at $($started[0].Path)"
          Start-Sleep -Seconds 20
          $main = Get-CimInstance Win32_Process -Filter "Name = 'Orivon.exe'" | Where-Object { $_.CommandLine -notmatch '--type=' }
          $alive = @(Get-PackageProcesses)
          if ($alive.Count -eq 0 -or -not $main) { throw 'the Store package exited within 20 s of starting' }
          Write-Host "still running 20 s later: $($alive.Count) process(es), main process $(@($main)[0].ProcessId)"
          $alive | Stop-Process -Force
          Start-Sleep -Seconds 3

      # The same smoke the other packages pass, against an app started inside the package with
      # Invoke-CommandInDesktopPackage, so it has its identity and a DevTools port to ask.
      - name: Smoke the Store package with its package identity
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-AppxPackage -Name $env:STORE_NAME
          $profileDir = Join-Path $env:RUNNER_TEMP 'orivon-store-profile'
          $program = Join-Path $package.InstallLocation 'app\Orivon.exe'
          Invoke-CommandInDesktopPackage -PackageFamilyName $env:STORE_PFN -AppId $env:STORE_APP_ID -Command $program `
            -Args "--user-data-dir=`"$profileDir`" --remote-debugging-port=9333" -PreventBreakaway
          node scripts/smoke-packaged.mjs --attach 9333
          $code = $LASTEXITCODE
          Get-Process -Name Orivon -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($code -ne 0) { exit $code }

      - name: Remove the Store package and the throwaway certificate
        if: always() && matrix.platform == 'win'
        shell: pwsh
        run: |
          if ($env:STORE_NAME) { Get-AppxPackage -Name $env:STORE_NAME | Remove-AppxPackage }
          if ($env:STORE_CERT_THUMBPRINT) {
            Remove-Item "Cert:\LocalMachine\TrustedPeople\$env:STORE_CERT_THUMBPRINT" -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\My\$env:STORE_CERT_THUMBPRINT" -ErrorAction SilentlyContinue
          }

      - name: Check the signature, mount each dmg and launch it
        if: matrix.platform == 'mac'
        run: |
          for dmg in release/*.dmg; do
            mount="$RUNNER_TEMP/$(basename "$dmg" .dmg)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
            codesign --verify --deep --strict --verbose=2 "$mount/Orivon.app"
            node scripts/run-headless.mjs node scripts/smoke-packaged.mjs "$mount/Orivon.app/Contents/MacOS/Orivon"
            # A helper of the Intel build, run under Rosetta, can hold the volume a few seconds longer.
            hdiutil detach "$mount" || { sleep 5; hdiutil detach -force "$mount"; }
          done

      # The one-line Terminal install, on the package just built: no quarantine attribute, and it launches.
      - name: Install with the one-line installer and launch it
        if: matrix.platform == 'mac'
        run: |
          mkdir -p "$RUNNER_TEMP/apps-local"
          ORIVON_DMG="$(ls release/*-arm64.dmg)" ORIVON_INSTALL_DIR="$RUNNER_TEMP/apps-local" ORIVON_NO_OPEN=1 bash scripts/install-macos.sh
          if xattr -r "$RUNNER_TEMP/apps-local/Orivon.app" | grep -q com.apple.quarantine; then
            echo "the installed app carries a quarantine attribute" >&2
            exit 1
          fi
          node scripts/run-headless.mjs node scripts/smoke-packaged.mjs "$RUNNER_TEMP/apps-local/Orivon.app/Contents/MacOS/Orivon"

      # The real path as a user runs it: the newest published release is looked up, downloaded and checked. During a
      # release the new one has no packages yet, so this would test the previous release; PRs and manual runs only.
      - name: Install the newest published release with the one-line installer
        if: matrix.platform == 'mac' && github.event_name != 'release'
        env:
          ORIVON_GITHUB_TOKEN: ${{ github.token }}
        run: |
          ORIVON_INSTALL_DIR="$RUNNER_TEMP/apps-release" ORIVON_NO_OPEN=1 bash scripts/install-macos.sh
          test -d "$RUNNER_TEMP/apps-release/Orivon.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/apps-release/Orivon.app"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orivon-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

      # Not named orivon-*: the jobs that attach and hash the release's files take only those, so this
      # package reaches neither the release nor its IPFS folder. The owner downloads it here for Partner
      # Center (release-checklist.md), hence the longer retention.
      - name: Keep the Store package for upload to Partner Center
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: store-msix
          path: release/Orivon-Store-*.appx
          if-no-files-found: error
          retention-days: 30

  # Copies of the Windows installer and the AppImage under a name that tags each for an app
  # (`Orivon-Setup-<version>-x64.<id>.exe`), one per entry of resources/flavours.json: the same bytes, so a
  # tag is only a name and the compiled build is never rebuilt for one (docs/development/packaging.md section
  # Tagged packages). Two checks fail the release: a copy whose SHA-256 differs from its original, and an
  # entry whose app is not the `domain` its port declares on main. The copies join the release through the
  # `orivon-` artifact name, like every other package.
  tagged:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: orivon-*
          path: packages
          merge-multiple: true

      - name: Copy the installer and the AppImage under each tagged name
        run: |
          set -euo pipefail
          mkdir tagged
          exe=(packages/Orivon-Setup-*-x64.exe)
          image=(packages/Orivon-*-x86_64.AppImage)
          test "${#exe[@]}" -eq 1 && test -f "${exe[0]}"
          test "${#image[@]}" -eq 1 && test -f "${image[0]}"
          for id in $(jq -r '.flavours[].id' resources/flavours.json); do
            [[ $id =~ ^[a-z0-9]{2,24}$ ]]
            for file in "${exe[0]}" "${image[0]}"; do
              name=${file##*/}
              cp "$file" "tagged/${name%.*}.$id.${name##*.}"
            done
          done
          ls -l tagged

      - name: Every tagged copy has the SHA-256 of its original
        run: |
          set -euo pipefail
          for id in $(jq -r '.flavours[].id' resources/flavours.json); do
            for file in packages/Orivon-Setup-*-x64.exe packages/Orivon-*-x86_64.AppImage; do
              name=${file##*/}
              copy="tagged/${name%.*}.$id.${name##*.}"
              test "$(sha256sum < "$file")" = "$(sha256sum < "$copy")" || { echo "::error::$copy differs from $file"; exit 1; }
            done
          done

      - name: Every flavour's app is the domain its port declares on main
        run: |
          set -euo pipefail
          jq -r '.flavours[] | [.id, .app, .port] | @tsv' resources/flavours.json | while IFS=$'\t' read -r id app port; do
            [[ $port =~ ^[a-z0-9-]{1,40}$ ]]
            domain=$(curl -fsSL "https://raw.githubusercontent.com/OrivonBrowser/orivon-ports/main/apps/$port/orivon.json" | jq -r .domain)
            test "$domain" = "$app" || { echo "::error::flavour $id opens $app, but apps/$port/orivon.json declares $domain"; exit 1; }
            echo "$id: $app"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orivon-flavours
          path: tagged/*
          if-no-files-found: error
          retention-days: 7

  # The CID of the release's files as one directory, with the same Kubo and flags a pinning node
  # uses to add them, so the node can refuse files that do not add up to it.
  manifest:
    needs: [package, tagged]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: orivon-*
          path: packages
          merge-multiple: true

      - name: Install Kubo
        run: |
          curl -fsSL -o kubo.tar.gz "https://github.com/ipfs/kubo/releases/download/$KUBO_VERSION/kubo_${KUBO_VERSION}_linux-amd64.tar.gz"
          echo "$KUBO_SHA256  kubo.tar.gz" | sha256sum -c -
          tar -xzf kubo.tar.gz
          sudo install kubo/ipfs /usr/local/bin/ipfs
          ipfs init --empty-repo >/dev/null

      - name: Write ipfs.json
        run: |
          scripts/pin-releases.sh manifest packages > ipfs.json
          cat ipfs.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orivon-ipfs
          path: ipfs.json
          if-no-files-found: error
          retention-days: 7

  # Its own job so the token that can write to the release never runs npm install's scripts or a
  # downloaded binary. It needs every package job, so a release gets all three systems or nothing.
  publish:
    if: github.event_name == 'release'
    needs: [package, tagged, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: orivon-*
          path: packages
          merge-multiple: true

      - name: Attach the packages and ipfs.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" packages/* --clobber --repo "$GITHUB_REPOSITORY"

      # Replaces the section a previous run wrote: a re-run rebuilds the packages, and their CID with them.
      - name: Write the release's CID into its description
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cid=$(jq -r .cid packages/ipfs.json)
          # Notes edited on github.com end their lines with CRLF.
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body | sed $'/^### On IPFS\r\\{0,1\\}$/,$d')
          printf '%s\n\n### On IPFS\n\nThe same files, as one folder: `ipfs://%s`. Open it in Orivon, or run `ipfs get %s`. The Orivon node pins it within about 15 minutes, with the two releases before it.\n' \
            "$body" "$cid" "$cid" > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  # Offers the Windows installer to winget-pkgs as a pull request from the owner's account. A winget
  # install is never met with SmartScreen: the default source is trusted. It runs after `publish`, so
  # the installer is a public asset, and it never checks out the repository or runs npm: the only
  # program it runs besides the runner's own gh is the Komac pinned above, and only the last step
  # holds the token. A release never goes red for a winget step that is not set up yet: that step
  # writes a warning and succeeds (packaging.md section winget).
  winget:
    if: github.event_name == 'release'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Choose the package, its version and its installer
        id: choose
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ "$PRERELEASE" = true ]; then
            id=Orivon.Browser.Preview
            dir=manifests/o/Orivon/Browser/Preview
          else
            id=Orivon.Browser
            dir=manifests/o/Orivon/Browser
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "run=false" >> "$GITHUB_OUTPUT"
          steps="Steps: docs/development/release-checklist.md, item The winget package."

          if [ "$HAS_TOKEN" != true ]; then
            echo "::warning title=winget::$id $version was not submitted to winget-pkgs: the repository secret WINGET_TOKEN is empty. $steps"
            exit 0
          fi

          # The versions winget-pkgs holds. A missing folder is a 404: the package is new to winget. The
          # preview folder sits inside the full release's, so it is not a version.
          if listing=$(gh api "repos/microsoft/winget-pkgs/contents/$dir" --jq '[.[] | select(.type == "dir") | .name | select(. != "Preview")] | join(" ")' 2>err.txt); then
            :
          elif grep -q 'HTTP 404' err.txt; then
            listing=
          else
            cat err.txt >&2
            exit 1
          fi
          if [ -z "$listing" ]; then
            echo "::warning title=winget::$id $version was not submitted to winget-pkgs: it holds no version of $id yet, and Komac only adds a version to a package that exists. Submit the first one by hand. $steps"
            exit 0
          fi
          for existing in $listing; do
            if [ "$existing" = "$version" ]; then
              echo "::notice title=winget::winget-pkgs already holds $id $version."
              exit 0
            fi
          done

          # Komac's own check for an open pull request is a prompt, which ends the run without submitting when CI=true.
          open=$(gh api -X GET search/issues -f q="repo:microsoft/winget-pkgs is:pr is:open in:title \"$id version $version\"" --jq .total_count)
          if [ "$open" != 0 ]; then
            echo "::notice title=winget::winget-pkgs already has an open pull request for $id $version."
            exit 0
          fi

          url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq "[.assets[] | select(.name == \"Orivon-Setup-$version-x64.exe\") | .url] | first // empty")
          if [ -z "$url" ]; then
            echo "::warning title=winget::$id $version was not submitted to winget-pkgs: the release has no asset Orivon-Setup-$version-x64.exe."
            exit 0
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Install Komac
        if: steps.choose.outputs.run == 'true'
        run: |
          curl -fsSL -o komac.tar.gz "https://github.com/russellbanks/Komac/releases/download/$KOMAC_VERSION/komac-${KOMAC_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz"
          echo "$KOMAC_SHA256  komac.tar.gz" | sha256sum -c -
          tar -xzf komac.tar.gz komac

      # Komac forks winget-pkgs into the token's account when there is no fork, and opens the pull request from it.
      - name: Submit the version to winget-pkgs
        if: steps.choose.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          PACKAGE_ID: ${{ steps.choose.outputs.id }}
          VERSION: ${{ steps.choose.outputs.version }}
          URL: ${{ steps.choose.outputs.url }}
          TAG: ${{ github.event.release.tag_name }}
        run: >-
          ./komac update "$PACKAGE_ID" --version "$VERSION" --urls "$URL"
          --release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          --created-with "Orivon release workflow" --created-with-url "https://github.com/$GITHUB_REPOSITORY"
          --skip-pr-check --submit
