name: CI

# With no code reviewer, CI is the reviewer (build-plan.md SS Week 0).
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `npm ci` runs the postinstall guard, so Rule 8 is enforced here too.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: No dependency requires a compiler (Rule 8)
        run: npm run check:natives

      # src/contracts/ is what lets several streams work at once. If it grows a
      # dependency edge, every stream inherits it. See
      # docs/development/parallel-work.md.
      - name: Contracts are complete and reference only their own siblings
        run: npm run check:contracts

      # The unit tests prove derive.ts (WebCrypto) matches the frozen table.
      # This proves an INDEPENDENT node:crypto implementation matches it too, so
      # the table cannot quietly become a recording of one implementation's own
      # bugs. Keys are not exportable in the MVP (ADR-0003), so a derivation
      # change is unrecoverable -- see ADR-0010.
      - name: Golden vectors match an independent implementation
        run: npm run check:vectors

      # This repository is public, and the autonomous build loop uses a real
      # credential (kept in ~/.config/orivon/notify.env, outside the repo).
      # A token pushed here is scraped within minutes and cannot be un-pushed.
      - name: No credentials in tracked files
        run: npm run check:secrets

      # Rule 1's restates-the-code test cannot see a file-header essay, and half
      # the source files had drifted into one. This bounds the comment block a
      # reader pays for before reaching any code; a file that genuinely needs
      # more says why in the file. docs/development/code-guidelines.md Rule 1.
      - name: No source file opens with an essay
        run: npm run check:comments

      - name: Build
        run: npm run build
