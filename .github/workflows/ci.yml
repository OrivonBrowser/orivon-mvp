name: CI

# `check` runs on every pull request and every push to main, and is the required status. The end-to-end suite
# runs only the specs a change can reach (scripts/ci/select-e2e.mjs, test/impact-map.json), split across parallel
# shards; main and the nightly run everything. A pull request from a fork runs e2e only after a maintainer adds
# the `ci:e2e` label; `ci:e2e-full` runs everything for any pull request.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      areas:
        description: 'e2e areas to run: impacted (changes against main), all, or a comma list of test/ folders'
        default: impacted

# One run per pull request: a new push cancels the one before it. A label that is not a ci: label gets a group of
# its own, so adding one cannot cancel a running check.
concurrency:
  group: ${{ github.event.action == 'labeled' && !startsWith(github.event.label.name, 'ci:') && format('ci-label-{0}', github.run_id) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.event.action != 'labeled' || startsWith(github.event.label.name, 'ci:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: the changelog-record step below compares with the merge base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      # Runs the Rule 8 postinstall guard and fetches Electron's binary. Keep
      # ELECTRON_SKIP_BINARY_DOWNLOAD unset: the unit suite reaches
      # test/support/launch-electron.mjs, whose import('electron') would fetch it anyway.
      - run: npm ci

      # webtorrent's tree (spike/app, gitignored) for the real-peer DHT tests,
      # which skip without it. `npm install`, since npm disagrees per platform
      # on whether ws's optional natives belong in the lock and `npm ci` fails
      # on that. --omit=optional keeps those natives out (Rule 8).
      - name: Install the real-peer UDP test fixture
        run: npm install --prefix spike/app --omit=optional --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: No dependency carries a high or critical advisory
        run: npm run check:advisories

      - name: No dependency requires a compiler (Rule 8)
        run: npm run check:natives

      # Every parallel stream inherits a dependency edge in src/contracts/.
      - name: Contracts are complete and reference only their own siblings
        run: npm run check:contracts

      # An independent node:crypto implementation must match the table the
      # unit tests hold derive.ts to. Keys are not exportable (ADR-0003), so a
      # derivation change is unrecoverable (ADR-0010).
      - name: Golden vectors match an independent implementation
        run: npm run check:vectors

      # Public repository: a pushed token is scraped within minutes.
      - name: No credentials in tracked files
        run: npm run check:secrets

      # code-guidelines.md Rule 1: each source file's leading comment block,
      # and every comment block in this workflow and root *.config.ts files.
      - name: No source file opens with an essay
        run: npm run check:comments

      - name: No source file over the 500/800-line limit
        run: npm run check:size

      # Two branches opened together can both take main's next A-number.
      - name: No duplicate entry number in docs/open-questions.md
        run: npm run check:questions

      - name: Every devlog bullet is at most 25 words
        run: npm run check:devlog

      # test/app-behaviours/catalogue.md: each entry is proven by an e2e spec CI runs, and no spec names an
      # entry the page lacks.
      - name: Every app behaviour is proven by a spec CI runs
        run: npm run check:app-behaviours

      # A changed or removed entry needs a line under "Changed for apps" in CHANGELOG.md.
      - name: A changed app behaviour has a changelog record
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run check:app-behaviours -- --base "origin/$BASE_REF"

      # test/app-behaviours/contracts-surface.txt is src/contracts/ without its comments; a change to it is a change
      # apps feel, and takes the same changelog record.
      - name: The contracts surface snapshot matches src/contracts/
        run: npm run check:contracts-surface

      - name: A changed contracts surface has a changelog record
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run check:contracts-surface -- --base "origin/$BASE_REF"

      # A spec or helper that moves takes its mentions with it: every test/ path a tracked file names exists.
      - name: Every path under test/ that a tracked file names exists
        run: npm run check:test-paths

      # test/impact-map.json says which e2e areas a change reaches: a new src/ directory must be mapped.
      - name: The e2e impact map covers every source directory and area
        run: npm run check:impact-map

      # A field src/contracts/manifest.ts documents must not be refused by the
      # loader's allowlist; the script reads both sides from their source.
      - name: Loader accepts every field the manifest contract declares
        run: npm run check:manifest-parity

      # ADR-0021: a global an app cannot replace breaks any bundle that
      # ponyfills it, silently. An omitted `writable` counts as locked.
      - name: Every page global carries a descriptor an app can replace
        run: npm run check:page-globals

      # Every question is asked in the tab's own window; a native message box is a separate OS window.
      - name: No native message box outside the files that may open one
        run: npm run check:native-dialogs

      - name: Build
        run: npm run build

      # Scans out/, then runs its own rebuild rather than reusing Build's
      # output. Last, so the cheaper checks fail first.
      - name: Developer-only grant path is absent from a packaged build
        run: npm run check:dev-grant-absent

  # Which e2e specs this run needs, from the event, the changed files and the labels. Plain node, no install.
  scope:
    if: ${{ github.event.action != 'labeled' || startsWith(github.event.label.name, 'ci:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      count: ${{ steps.select.outputs.count }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Select the e2e specs
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
          AREAS: ${{ inputs.areas }}
        run: |
          args=(--event "$EVENT" --ref "$REF" --labels "$LABELS" --areas "${AREAS:-impacted}")
          if [ "$FORK" = "true" ]; then args+=(--fork); fi
          if [ "$EVENT" = "pull_request" ]; then args+=(--base "origin/$BASE_REF"); fi
          if [ "$EVENT" = "workflow_dispatch" ]; then args+=(--base origin/main); fi
          node scripts/ci/select-e2e.mjs "${args[@]}"

  # The capability boundary end to end (testing.md "The end-to-end test"), one shard of the selected specs. Each
  # shard is its own runner, so the fixed fixture ports cannot clash. If a hosted runner cannot launch Electron,
  # gate the job to workflow_dispatch with the failing run as evidence; do not retry silently.
  e2e-shard:
    name: e2e-shard-${{ matrix.shard }}
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # ubuntu-latest has no display server, and Electron's window needs one.
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # The extension e2e files launch with the Chromium sandbox, since Electron
      # runs no service-worker preload without it. The runner restricts user
      # namespaces, so Chromium needs its setuid helper, as a .deb install sets up.
      - name: Enable Chromium's setuid sandbox helper
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # The device-backed WebHID spec makes a virtual device through /dev/uhid (test/support/virtual-hid/); the hosted
      # image ships the uhid module only in its extra modules. Only a shard that runs that spec pays the ~40 s.
      - name: Load the uhid kernel module
        if: ${{ contains(matrix.files, 'e2e-app-hid-device') }}
        run: |
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
          sudo modprobe uhid

      - name: Build with the developer-only hooks the specs need
        run: node scripts/build-e2e.mjs

      - name: Specs of this shard
        env:
          FILES: ${{ matrix.files }}
          # A missing device fails the spec here instead of skipping it.
          ORIVON_REQUIRE_VIRTUAL_HID: ${{ contains(matrix.files, 'e2e-app-hid-device') && '1' || '' }}
        run: xvfb-run -a node scripts/run-headless.mjs npx vitest run --config test/vitest.e2e.config.ts $FILES

      # Screenshots, console logs and the main-process log of every failed
      # spec (test/support/qa-evidence.mjs); absent when the shard passes.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-artifacts-e2e-${{ matrix.shard }}
          path: qa-artifacts/latest/
          if-no-files-found: ignore
          retention-days: 7

  # The one e2e status: it passes when every selected shard passed or nothing was selected. If branch protection
  # ever requires an e2e check, it is this job.
  e2e:
    needs: [scope, e2e-shard]
    if: ${{ always() && (github.event.action != 'labeled' || startsWith(github.event.label.name, 'ci:')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every selected shard passed, or none was selected
        env:
          SCOPE: ${{ needs.scope.result }}
          SHARDS: ${{ needs.e2e-shard.result }}
          MODE: ${{ needs.scope.outputs.mode }}
        run: |
          echo "scope: $SCOPE; shards: $SHARDS; mode: $MODE"
          [ "$SCOPE" = "success" ] || exit 1
          [ "$SHARDS" = "success" ] || [ "$SHARDS" = "skipped" ] || exit 1

  # The specs that need the build Orivon ships, with no developer-only hooks (test/app-behaviours/README.md). Its
  # own job: the shards build with those hooks on, and one run cannot hold both builds. It runs beside them
  # whenever any e2e is selected. A spec an entry rests on that carries `skipIf(!ORDINARY_BUILD)` must be
  # listed here: check:app-behaviours reads this job.
  e2e-ordinary:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Enable Chromium's setuid sandbox helper
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Build without the developer-only hooks
        run: node scripts/build-ordinary.mjs

      - name: Specs that need that build
        env:
          ORIVON_ORDINARY_BUILD: '1'
        run: >-
          xvfb-run -a node scripts/run-headless.mjs npx vitest run --config test/vitest.e2e.config.ts
          test/app-loading/e2e-loopback-grant.test.ts

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-artifacts-ordinary
          path: qa-artifacts/latest/
          if-no-files-found: ignore
          retention-days: 7
