name: Refresh .eth checkpoint

# Keeps the light client's bundled root of trust fresh on main: twice a week it runs
# scripts/refresh-eth-checkpoint.mjs (a finalized root two beacon APIs agree on) and, when the file changed,
# pushes automation/eth-checkpoint, opens a pull request (or updates the one that is open) and merges it once its
# CI passes. GitHub holds the pull_request runs of a pull request the workflow token opened until someone approves
# them, and only those runs satisfy main's required `check`, so the job approves them itself. Opening a pull request
# needs the repository setting "Allow GitHub Actions to create and approve pull requests"; without it the branch is
# still pushed and this run fails with that message.
on:
  schedule:
    - cron: '23 5 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-eth-checkpoint
  cancel-in-progress: false

env:
  BRANCH: automation/eth-checkpoint
  CHECKPOINT: src/main/verifier/mainnet-checkpoint.json

jobs:
  refresh:
    if: github.repository == 'OrivonBrowser/orivon-mvp'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Read a finalized checkpoint two beacon APIs agree on
        run: node scripts/refresh-eth-checkpoint.mjs --write

      - name: Push the branch and open or update the pull request
        id: push
        run: |
          if git diff --quiet -- "$CHECKPOINT"; then
            echo "The checkpoint on main is already the finalized one."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add "$CHECKPOINT"
          git commit -m 'Refresh the bundled .eth light-client checkpoint' \
            -m 'A finalized root two independent beacon APIs agree on, read by scripts/refresh-eth-checkpoint.mjs.'
          git push --force origin "HEAD:refs/heads/$BRANCH"
          cp "$CHECKPOINT" "$RUNNER_TEMP/checkpoint.json"

          number=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            cat > "$RUNNER_TEMP/body.md" <<'BODY'
          ## What changes for the user

          A fresh install opens `.eth` names: the light client refuses a bundled checkpoint over 14 days old, and this one is new.

          ## Changes

          ### Refresh the bundled .eth light-client checkpoint

          - **Goal**. Keep the light client's root of trust on `main` younger than a release may ship.
          - **What it achieves**. `src/main/verifier/mainnet-checkpoint.json` holds a finalized root two independent beacon APIs agreed on.
          - **How it works**. The scheduled workflow `refresh-eth-checkpoint.yml` ran `scripts/refresh-eth-checkpoint.mjs --write`, approved this pull request's CI runs, which GitHub holds for a pull request the workflow token opened, and merges it once `check` and `e2e` pass. If it is still open, that run's page says why.

          ## How it was verified

          The script refuses unless both APIs return the same finalized root and slot. CI runs on this pull request.
          BODY
            gh pr create --base main --head "$BRANCH" \
              --title 'Refresh the bundled .eth light-client checkpoint' \
              --body-file "$RUNNER_TEMP/body.md" || {
                echo "::error::The branch $BRANCH is pushed, but this repository does not let GitHub Actions open pull requests (Settings > Actions > General > Allow GitHub Actions to create and approve pull requests). Open it by hand or enable the setting."
                exit 1
              }
          else
            echo "Pull request #$number already carries this branch; the push updated it."
          fi
          echo "number=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')" >> "$GITHUB_OUTPUT"

      # main takes only an up-to-date branch whose `check` passed, and the e2e shards CI selected are kept green by
      # whoever merges (testing.md), so both have to pass. When main moved past the branch meanwhile, the branch is
      # rebuilt on main and its checks run again.
      - name: Merge the pull request once its checks pass
        if: steps.push.outputs.number != ''
        env:
          NUMBER: ${{ steps.push.outputs.number }}
        run: |
          approve () {
            local ids='' id
            for _ in $(seq 30); do
              ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$1&event=pull_request&status=action_required" --jq '.workflow_runs[].id')
              [ -n "$ids" ] && break
              sleep 10
            done
            if [ -z "$ids" ]; then
              echo "::error::No pull_request run of ${1:0:9} waits for approval, so nothing reports check on #$NUMBER. Approve its runs on the pull request's Checks tab, or run CI on it, and merge it by hand."
              return 1
            fi
            for id in $ids; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" > /dev/null || {
                echo "::error::The workflow token may not approve run $id of #$NUMBER. Approve its runs on the pull request's Checks tab and merge it by hand."
                return 1
              }
            done
          }
          # Every run named $2 on commit $1, waited for: passed once each succeeded or was skipped (`e2e` is, when
          # CI selected no area).
          passed () {
            local runs
            for _ in $(seq 240); do
              runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$1/check-runs?check_name=$2" --jq '[.check_runs[] | .conclusion // "pending"] | join(" ")')
              case " $runs " in
                '  ' | *' pending '*) sleep 15 ;;
                *) [ -z "$(printf '%s\n' $runs | grep -vxE 'success|skipped')" ] && return 0
                   echo "::error::$2 on ${1:0:9} of #$NUMBER ended: $runs."; return 1 ;;
              esac
            done
            echo "::error::$2 on ${1:0:9} of #$NUMBER did not finish within an hour."
            return 1
          }

          for attempt in 1 2 3; do
            sha=$(git rev-parse HEAD)
            approve "$sha" && passed "$sha" check && passed "$sha" e2e || exit 1
            gh pr merge "$NUMBER" --merge --match-head-commit "$sha" && exit 0
            git fetch -q origin main
            git switch -q -C "$BRANCH" FETCH_HEAD
            cp "$RUNNER_TEMP/checkpoint.json" "$CHECKPOINT"
            if git diff --quiet -- "$CHECKPOINT"; then
              echo "main already carries this checkpoint."
              exit 0
            fi
            git add "$CHECKPOINT"
            git commit -q -m 'Refresh the bundled .eth light-client checkpoint' \
              -m 'A finalized root two independent beacon APIs agree on, read by scripts/refresh-eth-checkpoint.mjs.'
            git push --force origin "HEAD:refs/heads/$BRANCH"
          done
          echo "::error::main moved past #$NUMBER three times while its checks ran. Merge it by hand."
          exit 1
