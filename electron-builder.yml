# electron-builder configuration: Linux (deb + AppImage), Windows (an NSIS installer) and
# macOS (a dmg each for Apple silicon and Intel). `npm run package:linux|win|mac` builds one
# system on that system; .github/workflows/release.yml builds all three on each GitHub
# release, launches each package, and attaches them to the release
# (docs/development/packaging.md).
#
# No certificate is bought: Windows packages are unsigned, so SmartScreen warns on first
# run, and macOS packages are ad-hoc signed (`mac.identity` below), so Gatekeeper asks the
# person to allow the app once. The schema here is electron-builder 26.x's, checked against
# the installed node_modules/app-builder-lib/scheme.json.
# The `win` and `mac` blocks also register Orivon with the system as a browser: `protocols`
# below, and build/installer.nsh for the Windows registry entries. Whether a built package
# lists Orivon as a browser on Windows and macOS is unverified (*provisional*).

appId: com.orivonstack.orivon
# Reverse-DNS of orivonstack.com, the project's actual registered domain (already used
# for docs.orivonstack.com and the OrivonStack forum -- docs/inventory.md). Not invented
# for this file.
productName: Orivon
# The name a user sees installed on their machine, the same as README.md's own
# title ("Orivon").

directories:
  output: release
  # Already gitignored (.gitignore "Electron / packaging" section) -- verified, not
  # assumed, before writing this key.
  # buildResources (icon source, etc.) is left at its default, `build/`. `build/icon.png`
  # is the 512x512 app icon; electron-builder derives every system's icon formats and
  # sizes from it (the Windows .ico, the macOS .icns, the Linux sizes).

# --- Contents of app.asar ----------------------------------------------------------
# An allowlist, not a blocklist subtracted from `**/*`. This repo also contains spike/,
# test/, scripts/, devlog/, .claude/, docs/, and root-level markdown alongside the
# actual app -- a blocklist has to name every one of those, today and whenever a new
# one is added later; an allowlist just never sees them. That is what this task asked
# for ("does not accidentally ship spike/, docs/, orchestration remnants or test
# files") and it is the stronger guarantee of the two approaches.
files:
  - out/**/*
  - package.json
# This list replaces electron-builder's default glob for SOURCE files only. The
# production tree of package.json's "dependencies" (the ENS resolver's, the IPFS/IPNS
# reader's and the renderer shims' packages) is still copied into app.asar's own
# node_modules/: electron-vite bundles some of them into out/ and leaves the rest to be
# required from there at run time. webtorrent and every app-side library are not shell
# dependencies: they are app assets fetched into `userData` (ADR-0005).

asar: true
# On by default in electron-builder; stated explicitly because it is a deliberate
# choice here, not an unexamined default -- see docs/development/packaging.md for what
# it does and does not buy.

npmRebuild: false
# SAFETY CONSTRAINT, not a build-time-savings optimisation -- read this before ever
# flipping it. `electron-builder`'s own installed source
# (node_modules/app-builder-lib/out/packager.js:454-455) checks exactly this flag: if it
# is not `false`, packaging calls into `installOrRebuild`, which chains through
# `@electron/rebuild` into `node-gyp` for real. Both are ordinary (non-"optional")
# devDependencies of `app-builder-lib`, so they are already installed in this tree on
# every platform right now, today, whether or not this flag is ever touched --
# `node_modules/@electron/rebuild` and `node_modules/node-gyp` both exist already.
# `npmRebuild: false` is the ONLY thing stopping that dormant `node-gyp` from actually
# running at packaging time. On a machine with no C/C++ toolchain -- the Windows and
# macOS runners that build releases, and the run-from-source path Rule 8 (CLAUDE.md)
# exists to protect -- a real `node-gyp` invocation fails outright.
#
# `npm run check:natives` CANNOT see a regression here: its scope is install-time
# scripts (Rule 8's literal wording), not electron-builder's packaging-time behaviour.
# A future contributor deleting or flipping this line
# will not get an error from any automated check -- see docs/open-questions.md A49 for
# the open question this leaves about what Rule 8 is actually meant to guarantee.
#
# `npmRebuild` is a TOP-LEVEL key in electron-builder 26.x, the version npm installs.
# Do not nest it under `nativeModules:` the way the v27 docs show: v27 is alpha-only,
# and 26.x's schema (node_modules/app-builder-lib/scheme.json) rejects the nested form
# with "configuration has an unknown property 'nativeModules'". See
# docs/development/packaging.md "Version notes: 26.x, not v27".

publish: null
# Explicitly disabled, not merely unconfigured. electron-builder auto-detects a GitHub
# publish target from package.json's `repository` field (this repo has one, pointing at
# github.com/OrivonBrowser/orivon-mvp), and per electron-builder's own PublishManager,
# an explicit `null` here -- not just omitting the key -- is what guarantees no
# `app-update.yml` is written into the packaged resources and no publish config is
# resolved from any source. Auto-update is cut by owner decision (build-plan.md,
# 2026-08-25): unsigned `electron-updater` on Linux verifies only a SHA-512 fetched from
# the same host that serves the binary, which is a standing remote-code-execution
# channel keyed to a GitHub token. v0 checks and notifies instead (a separate,
# already-scoped build step) -- this key exists so that decision cannot be silently
# undone by a future contributor passing `--publish` without reading either doc.
# The release workflow attaches packages with `gh release upload`, which writes no
# update metadata.

# --- Electron fuses ------------------------------------------------------------------
# Toggles written into the packaged Electron binary after packing and before signing
# (app-builder-lib calls @electron/fuses; field names are its FuseV1Options). A fuse not
# listed keeps Electron's default.
electronFuses:
  # ELECTRON_RUN_AS_NODE, NODE_OPTIONS and --inspect would let a same-user process run
  # the browser binary as plain Node or attach a debugger to it. Nothing relies on them:
  # the verifier host starts through utilityProcess.fork, which this fuse does not
  # affect, and src/main/launch/peer-spawn.ts strips ELECTRON_RUN_AS_NODE itself.
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # The cookie database is encrypted with the OS keyring, as in Chrome.
  enableCookieEncryption: true
  # App code loads only from app.asar, and the asar's header hash is checked first.
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  # A file:// page gets no more reach than a web page does (ADR-0059): the shell's own
  # pages load from orivon-shell:, so nothing needs the extra privileges.
  grantFileProtocolExtraPrivileges: false

# --- Cross-platform URL-scheme registration -----------------------------------------
# `schemes: [http, https]`, not a custom `orivon://` scheme -- Orivon is applying to be
# a BROWSER, not registering a deep-link handler for itself. This is the piece that
# makes "set as default browser" reachable at all: `xdg-settings set
# default-web-browser` (Linux) looks for an installed .desktop file whose MimeType=
# line includes `x-scheme-handler/http` and `x-scheme-handler/https`, and this is the
# documented, cross-platform electron-builder mechanism that populates it (it would
# equally populate the macOS Info.plist; the Windows registry entries are written by
# build/installer.nsh instead).
# This config key alone does not make Orivon a working browser at the OS level -- the
# app itself must still call `app.setAsDefaultProtocolClient()` at runtime. That is
# application code in src/main, out of scope for this file; see
# docs/development/packaging.md.
protocols:
  name: Orivon URL Handler
  schemes:
    - http
    - https

extraResources:
  - from: build/icon.png
    to: icon.png
# The icon src/main/shell/window-frame.ts hands to BaseWindow, copied into every
# system's resources folder (process.resourcesPath) so a packaged build can load it; a
# run from source reads the repo's build/icon.png. Best-effort for the window itself:
# GNOME's dock keys off the .desktop entry instead (StartupWMClass=orivon below).

linux:
  target:
    - deb
    - AppImage
  # deb listed first because it is the PRIMARY artefact, not an equal alternative to
  # AppImage -- only an installed package can register a .desktop file where
  # `xdg-settings` can find it, and the project's success metric is measured in
  # daily-driver hours (docs/scope.md). A bare AppImage cannot self-integrate:
  # electron-builder's own docs state plainly that since electron-builder 21, AppImages
  # do not automatically create desktop files, associate file types, or register with
  # the application menu. AppImage remains the trial artefact; the
  # first-run "install desktop entry" flow that closes its integration gap is a
  # separate, already-scoped piece of work -- this file only has to not make it
  # impossible, which an allowlisted `files` and a correct `linux.desktop` block do not.

  category: "Network;WebBrowser;"
  # freedesktop.org Categories=. Two values, not one: WebBrowser is the specific
  # category, and the freedesktop.org menu spec expects its required parent category
  # (Network) to be present alongside it, not instead of it -- most desktop-menu
  # implementations key off both.

  # No `mimeTypes`: the entry lists only `x-scheme-handler/http` and `/https`, from `protocols`
  # above. A browser that claims `text/html` is offered every .html file and every `xdg-open` of
  # a page, and the desktop's browser list is keyed on the two schemes. Opening a local file is
  # a separate feature (docs/open-questions.md A375).

  synopsis: A browser that runs applications Chrome cannot
  description: >-
    Orivon reaches the network and filesystem under user-granted, per-app capabilities,
    so that ordinary web frontends delivered from a URL can do what today requires a
    native install. Pre-alpha.
  # Reuses README.md's own tagline rather than writing new marketing copy for a second
  # place it can drift out of sync.

  vendor: OrivonStack
  maintainer: Orivon <accauntacaso57@gmail.com>
  # package.json has no "author" field, and this task may not add one (package.json is
  # off limits here -- see the PR description). A .deb's control file requires a
  # Maintainer entry, so it is supplied at this layer instead. The address reuses
  # SECURITY.md's existing public fallback contact rather than introducing a new one.

  executableName: orivon
  # Linux binaries are lowercase by convention (`/usr/bin/orivon`, not `/usr/bin/Orivon`
  # next to it); left unset, this defaults to `productName` verbatim. This is also the
  # name baked into the v27 generated launcher script that every Linux target now
  # execs into (electron-builder's own migration notes: Linux targets moved to a
  # generated shell-script entry point in v27, and custom desktop/AppArmor/MIME
  # overrides need to reference it, not the raw binary, if anyone adds one later).

  desktop:
    entry:
      Name: Orivon
      Comment: A browser that runs applications Chrome cannot
      Type: Application
      Terminal: false
      StartupWMClass: orivon
      # Matches executableName above so window-manager/taskbar matching keys off the
      # same string window and launcher agree on. Unconfirmed against a real packaged
      # launch's actual WM_CLASS -- src/main sets no explicit app name today (checked:
      # no `app.setName`/`BrowserWindow` title override exists in src/main/*.ts as of
      # this writing), so Electron's runtime default may not match this string until
      # someone sets one. Worth a first-build check, not a blocker.

deb:
  packageCategory: web
  # Debian's Section: field -- a different taxonomy from freedesktop Categories= above
  # (apt/dpkg's own archive grouping, not the desktop menu's). "web" is the actual
  # Debian section browsers ship under (e.g. Firefox, Chromium packages both use it),
  # not a guess -- "net" would be the wrong adjacent category (network clients/tools
  # generally, not browsers specifically).

  # The installed entry's right-click menu in a dock or taskbar (a freedesktop "desktop action").
  # Under `deb`, never `linux`: electron-builder merges `linux.desktop` into the AppImage's
  # entry too, whose `Exec` is AppRun, and an action naming /opt/Orivon would launch nothing there.
  # The ids are the conventional ones, so GNOME treats `new-window` as the app's own new-window action rather than
  # adding a second "New Window" item. They and the `orivon.desktop` file name are what a pinned launcher keys on.
  desktop:
    entry:
      Actions: "new-window;new-private-window;"
    desktopActions:
      new-window:
        Name: New Window
        Exec: /opt/Orivon/orivon --new-window
      new-private-window:
        Name: New Private Window
        Exec: /opt/Orivon/orivon --new-private-window

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

# --- Windows and macOS: packages, and registration as a browser --------------------------
# Only an installed package registers Orivon as a browser (src/main/os/default-browser.ts).
win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # A per-user install needs no administrator and lets the person choose the folder. It writes
  # the browser's registry entries under HKCU, where Windows reads a user's default apps from;
  # build/installer.nsh writes them with SHCTX, so a machine-wide install would write HKLM.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  # `protocols` above becomes CFBundleURLTypes (http, https). No document types are declared:
  # opening a local file in Orivon is not offered yet (A375).
  # Ad-hoc signing ("-"), not none: Apple silicon refuses to launch an unsigned binary,
  # and packaging rewrites the Electron binary (fuses, name, Info.plist), so its own
  # signature no longer holds. Hardened runtime is off because it rejects an ad-hoc app
  # loading the Electron framework; it matters only for notarization, which needs a
  # bought Developer ID certificate.
  identity: "-"
  hardenedRuntime: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
