# electron-builder configuration -- Linux only (deb + AppImage).
#
# Scope, deliberately: no `win:` / `mac:` blocks and no code-signing config of any kind.
# Windows and macOS ship run-from-source instead of a signed installer, on purpose, to
# avoid buying certificates (docs/planning/build-plan.md "Platform policy"). Signing is
# not "left off for now" -- for this file it is simply out of scope.
#
# BUILT. A real `electron-builder` invocation was run for the first time 2026-09-03
# (see docs/development/packaging.md), producing real `deb`/`AppImage` artefacts in
# `release/` from a real `npm install --save-dev electron-builder` and a real `npm run
# build`. That run found this file had been checked by eye against the wrong schema
# generation -- see the CORRECTED note under `npmRebuild` below for what changed and why
# -- so treat the schema shape here as verified against an installed electron-builder,
# not merely eyeballed against docs. Not every claim in this file has been independently
# confirmed against that build's actual output yet; docs/development/packaging.md's
# "Known gaps" section is the honest list of what is and isn't.

appId: com.orivonstack.orivon
# Reverse-DNS of orivonstack.com, the project's actual registered domain (already used
# for docs.orivonstack.com and the OrivonStack forum -- docs/inventory.md). Not invented
# for this file.
productName: Orivon
# The name a user sees installed on their machine, the same as README.md's own
# title ("Orivon").

directories:
  output: release
  # Already gitignored (.gitignore "Electron / packaging" section) -- verified, not
  # assumed, before writing this key.
  # buildResources (icon source, etc.) is left at its default, `build/`. RESOLVED
  # 2026-09-16: `build/icon.png` is now a real 512x512 app icon, generated from the
  # owner's own logo -- electron-builder picks it up from that default location with no
  # key here, and derives the smaller sizes itself. The note this replaces said no icon
  # had been designed and packaged builds therefore shipped the stock Electron one.

# --- Contents of app.asar ----------------------------------------------------------
# An allowlist, not a blocklist subtracted from `**/*`. This repo also contains spike/,
# test/, scripts/, devlog/, .claude/, docs/, and root-level markdown alongside the
# actual app -- a blocklist has to name every one of those, today and whenever a new
# one is added later; an allowlist just never sees them. That is what this task asked
# for ("does not accidentally ship spike/, docs/, orchestration remnants or test
# files") and it is the stronger guarantee of the two approaches.
files:
  - out/**/*
  - package.json
# This list does NOT mean "nothing from node_modules ships": it replaces
# electron-builder's default SOURCE-file glob, a separate thing from the production
# dependency tree it resolves from package.json's "dependencies" and copies into
# `app.asar`'s own `node_modules/` regardless -- confirmed against a real
# `npx electron-builder --linux dir`, whose `release/linux-unpacked/resources/
# app.asar` contains a `node_modules/` with `viem`, `multiformats`, `ipfs-unixfs`,
# `ipns` and the rest of the eighteen packages listed there (`npx asar list`).
# package.json's "dependencies" are the real npm packages the ENS resolver
# (src/protocols/ens/), the IPFS/IPNS reader (src/protocols/ipfs/) and the renderer's
# polyfilled shims (src/shim/module-map.ts) need, some bundled into `out/` by
# electron-vite's build and some left external to be required from this
# electron-builder-populated `node_modules/` at runtime -- both paths ship, and
# neither needed a `files` entry of its own. webtorrent and every app-side library
# are unaffected by any of this: they stay pre-built app assets fetched into
# `userData` at runtime, never a shell dependency (build-plan.md "Platform policy"
# #1, ADR-0005).

asar: true
# On by default in electron-builder; stated explicitly because it is a deliberate
# choice here, not an unexamined default -- see docs/development/packaging.md for what
# it does and does not buy.

npmRebuild: false
# SAFETY CONSTRAINT, not a build-time-savings optimisation -- read this before ever
# flipping it. `electron-builder`'s own installed source
# (node_modules/app-builder-lib/out/packager.js:454-455) checks exactly this flag: if it
# is not `false`, packaging calls into `installOrRebuild`, which chains through
# `@electron/rebuild` into `node-gyp` for real. Both are ordinary (non-"optional")
# devDependencies of `app-builder-lib`, so they are already installed in this tree on
# every platform right now, today, whether or not this flag is ever touched --
# `node_modules/@electron/rebuild` and `node_modules/node-gyp` both exist already.
# `npmRebuild: false` is the ONLY thing stopping that dormant `node-gyp` from actually
# running at packaging time. On a machine with no C/C++ toolchain -- exactly the
# Windows/macOS run-from-source path Rule 8 (CLAUDE.md) exists to protect -- a real
# `node-gyp` invocation fails outright.
#
# `npm run check:natives` CANNOT see a regression here: its scope is install-time
# scripts (Rule 8's literal wording), not electron-builder's packaging-time behaviour.
# A future contributor deleting or flipping this line to add Windows/macOS packaging
# will not get an error from any automated check -- see docs/open-questions.md A49 for
# the open question this leaves about what Rule 8 is actually meant to guarantee.
#
# `npmRebuild` is a TOP-LEVEL key in electron-builder 26.x, the version npm installs.
# Do not nest it under `nativeModules:` the way the v27 docs show: v27 is alpha-only,
# and 26.x's schema (node_modules/app-builder-lib/scheme.json) rejects the nested form
# with "configuration has an unknown property 'nativeModules'". See
# docs/development/packaging.md "Version notes: 26.x, not v27".

publish: null
# Explicitly disabled, not merely unconfigured. electron-builder auto-detects a GitHub
# publish target from package.json's `repository` field (this repo has one, pointing at
# github.com/OrivonBrowser/orivon-mvp), and per electron-builder's own PublishManager,
# an explicit `null` here -- not just omitting the key -- is what guarantees no
# `app-update.yml` is written into the packaged resources and no publish config is
# resolved from any source. Auto-update is cut by owner decision (build-plan.md,
# 2026-08-25): unsigned `electron-updater` on Linux verifies only a SHA-512 fetched from
# the same host that serves the binary, which is a standing remote-code-execution
# channel keyed to a GitHub token. v0 checks and notifies instead (a separate,
# already-scoped build step) -- this key exists so that decision cannot be silently
# undone by a future contributor passing `--publish` without reading either doc.

# --- Electron fuses ------------------------------------------------------------------
# Compile-time toggles burned into the packaged Electron binary itself, applied after
# packing and before signing (node_modules/app-builder-lib/out/platformPackager.js's
# doAddElectronFuses -> @electron/fuses, already an app-builder-lib dependency --
# nothing new to install). Field names are `FuseV1Options`' own
# (node_modules/@electron/fuses/dist/config.js's own definitions, and
# node_modules/app-builder-lib/scheme.json's `FuseOptionsV1`), not electron-builder's
# invention. A field left out of this block keeps Electron's own shipped default for
# that fuse, exactly as if this key did not exist.
electronFuses:
  runAsNode: false
  # Off: the ELECTRON_RUN_AS_NODE environment variable, if honoured, re-execs this
  # binary as a plain Node process with none of the app's own sandboxing -- a
  # same-user attacker (or a stray leftover export) could run arbitrary code under
  # a name that looks like the browser. Checked first: src/main/verifier/
  # verifier-subsystem.ts forks the verifier host through `utilityProcess.fork`
  # (Electron's own API, which @electron/fuses' own runAsNode description says does
  # NOT depend on this fuse -- only a Node `child_process.fork` of the Electron
  # binary itself would), and src/main/launch/peer-spawn.ts already strips this same
  # variable from a spawned peer's own environment. Nothing in src/ or scripts/
  # relies on it being honoured by a packaged build.
  enableCookieEncryption: true
  # Off by default, so Chromium's cookie database sits in plaintext on disk today
  # (a verifier finding: F4). On here asks the OS keyring/DPAPI to encrypt it instead,
  # matching Chrome's own default.
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # NODE_OPTIONS and --inspect(-brk) both hand a same-user attacker a debugger or an
  # arbitrary module preload against the packaged binary. Nothing here depends on
  # either: DevTools (shell F1, src/main/shell/context-menu.ts and the shell's own
  # menu) opens Chromium's own devtools, never Node's inspector, and dev-mode
  # (src/main/dev/dev-mode.ts) is a separate, unpackaged-only code path.
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  # Together: a packaged launch may load app code only from its own app.asar, not a
  # loose `app/` folder or the bundled `default_app.asar`, and that asar's own header
  # hash is checked before anything inside it runs -- an asar replaced or appended to
  # on disk after packaging is refused rather than trusted.
  #
  # grantFileProtocolExtraPrivileges: left unset, i.e. Electron's own default (on).
  # Off would stop a `file://` page from using `fetch()` on another `file://` asset
  # and from registering a service worker (@electron/fuses' own description) --
  # every renderer entry this app loads (chrome, tabs' dashboard, the toolbar
  # popups, the welcome screen) is a `file://` page in a packaged build
  # (renderer-entry.ts), and the orivon-electron skill records this exact
  # `file://`-as-secure-context service-worker path as already relied on for a
  # ported app's media playback. Untested with the fuse off; a packaged build
  # confirming it still works would let this be turned off too.

# --- Cross-platform URL-scheme registration -----------------------------------------
# `schemes: [http, https]`, not a custom `orivon://` scheme -- Orivon is applying to be
# a BROWSER, not registering a deep-link handler for itself. This is the piece that
# makes "set as default browser" reachable at all: `xdg-settings set
# default-web-browser` (Linux) looks for an installed .desktop file whose MimeType=
# line includes `x-scheme-handler/http` and `x-scheme-handler/https`, and this is the
# documented, cross-platform electron-builder mechanism that populates it (it would
# equally populate the Windows registry / macOS Info.plist equivalents, unused here
# since only Linux targets are configured below).
# This config key alone does not make Orivon a working browser at the OS level -- the
# app itself must still call `app.setAsDefaultProtocolClient()` at runtime. That is
# application code in src/main, out of scope for this file; see
# docs/development/packaging.md.
protocols:
  name: Orivon URL Handler
  schemes:
    - http
    - https

linux:
  target:
    - deb
    - AppImage
  # deb listed first because it is the PRIMARY artefact, not an equal alternative to
  # AppImage -- only an installed package can register a .desktop file where
  # `xdg-settings` can find it, and the project's success metric is measured in
  # daily-driver hours (docs/scope.md). A bare AppImage cannot self-integrate:
  # electron-builder's own docs state plainly that since electron-builder 21, AppImages
  # do not automatically create desktop files, associate file types, or register with
  # the application menu. AppImage remains the trial artefact; the
  # first-run "install desktop entry" flow that closes its integration gap is a
  # separate, already-scoped piece of work -- this file only has to not make it
  # impossible, which an allowlisted `files` and a correct `linux.desktop` block do not.

  extraResources:
    - from: build/icon.png
      to: icon.png
  # The icon src/main/window.ts hands to BaseWindow, copied into resources/ so a packaged
  # build can load it (process.resourcesPath); a run from source reads the repo's
  # build/icon.png. Best-effort for the window itself: GNOME's dock keys off the .desktop
  # entry instead (StartupWMClass=orivon below, written by electron-builder from this same
  # build/icon.png), which is what actually decides the icon a taskbar shows. The
  # resources/ path is read from electron-builder's schema, not yet observed in a real
  # package -- check it on the next `package:linux`.

  category: "Network;WebBrowser;"
  # freedesktop.org Categories=. Two values, not one: WebBrowser is the specific
  # category, and the freedesktop.org menu spec expects its required parent category
  # (Network) to be present alongside it, not instead of it -- most desktop-menu
  # implementations key off both.

  mimeTypes:
    - text/html
  # Alongside `protocols.schemes` above, not a duplicate of it: `protocols` covers URL
  # *schemes* (x-scheme-handler/*), text/html is a document MIME type rather than a
  # scheme, so it has its own config surface. Together, electron-builder's documented
  # behaviour is that they compose into one MimeType= line:
  # `x-scheme-handler/http;x-scheme-handler/https;text/html;`. That composition is
  # read from current docs, not observed against a real build -- verify the generated
  # .desktop file's actual MimeType= line the first time this is really packaged (see
  # docs/development/packaging.md).

  synopsis: A browser that runs applications Chrome cannot
  description: >-
    Orivon reaches the network and filesystem under user-granted, per-app capabilities,
    so that ordinary web frontends delivered from a URL can do what today requires a
    native install. Pre-alpha; nothing is released yet.
  # Reuses README.md's own tagline rather than writing new marketing copy for a second
  # place it can drift out of sync.

  vendor: OrivonStack
  maintainer: Orivon <accauntacaso57@gmail.com>
  # package.json has no "author" field, and this task may not add one (package.json is
  # off limits here -- see the PR description). A .deb's control file requires a
  # Maintainer entry, so it is supplied at this layer instead. The address reuses
  # SECURITY.md's existing public fallback contact rather than introducing a new one.

  executableName: orivon
  # Linux binaries are lowercase by convention (`/usr/bin/orivon`, not `/usr/bin/Orivon`
  # next to it); left unset, this defaults to `productName` verbatim. This is also the
  # name baked into the v27 generated launcher script that every Linux target now
  # execs into (electron-builder's own migration notes: Linux targets moved to a
  # generated shell-script entry point in v27, and custom desktop/AppArmor/MIME
  # overrides need to reference it, not the raw binary, if anyone adds one later).

  desktop:
    entry:
      Name: Orivon
      Comment: A browser that runs applications Chrome cannot
      Type: Application
      Terminal: false
      StartupWMClass: orivon
      # Matches executableName above so window-manager/taskbar matching keys off the
      # same string window and launcher agree on. Unconfirmed against a real packaged
      # launch's actual WM_CLASS -- src/main sets no explicit app name today (checked:
      # no `app.setName`/`BrowserWindow` title override exists in src/main/*.ts as of
      # this writing), so Electron's runtime default may not match this string until
      # someone sets one. Worth a first-build check, not a blocker.

deb:
  packageCategory: web
  # Debian's Section: field -- a different taxonomy from freedesktop Categories= above
  # (apt/dpkg's own archive grouping, not the desktop menu's). "web" is the actual
  # Debian section browsers ship under (e.g. Firefox, Chromium packages both use it),
  # not a guess -- "net" would be the wrong adjacent category (network clients/tools
  # generally, not browsers specifically).
