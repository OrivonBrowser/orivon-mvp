<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orivon build loop</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3;
    --dim: #8b949e; --accent: #58a6ff; --warn: #d29922; --bad: #f85149; --good: #3fb950;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa; --panel: #fff; --line: #d0d7de; --text: #1f2328;
      --dim: #656d76; --accent: #0969da; --warn: #9a6700; --bad: #cf222e; --good: #1a7f37;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .07em;
       color: var(--dim); margin: 2rem 0 .6rem; }
  .sub { color: var(--dim); font-size: .85rem; margin-bottom: 1rem; }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: .85rem 1rem; margin-bottom: .6rem; }
  .card.warn { border-color: var(--warn); }
  .card.bad { border-color: var(--bad); }
  .title { font-weight: 600; }
  .meta { color: var(--dim); font-size: .8rem; margin-top: .2rem; }
  .tag { display: inline-block; padding: .1rem .45rem; border-radius: 5px;
         background: var(--line); font-size: .72rem; margin-right: .3rem; }
  .row { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
  .spacer { flex: 1; }
  a { color: var(--accent); }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: .35rem .7rem; cursor: pointer; font-size: .85rem;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { border-color: var(--bad); color: var(--bad); }
  button.on { background: var(--warn); border-color: var(--warn); color: #000; }
  textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: .5rem; font: inherit; font-size: .88rem; margin: .5rem 0;
    min-height: 4.5rem; resize: vertical;
  }
  .opt { font-size: .85rem; color: var(--dim); margin: .15rem 0 .15rem .9rem; }
  .rec { font-size: .85rem; margin-top: .4rem; }
  .rec b { color: var(--good); }
  .empty { color: var(--dim); font-size: .88rem; font-style: italic; }
  .banner { padding: .7rem 1rem; border-radius: 9px; margin-bottom: 1rem; font-size: .9rem; }
  .banner.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); border: 1px solid var(--bad); }
  .banner.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); border: 1px solid var(--warn); }
  .counts { display: flex; gap: 1.1rem; flex-wrap: wrap; font-size: .85rem; color: var(--dim); }
  .counts b { color: var(--text); }
  footer { margin-top: 2.5rem; color: var(--dim); font-size: .8rem; }
  code { background: var(--panel); padding: .1rem .3rem; border-radius: 4px; font-size: .85em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Orivon build loop</h1>
  <div class="sub" id="sub">connecting…</div>
  <div id="banners"></div>
  <div class="counts" id="counts"></div>

  <h2>Waiting for you — pull requests</h2>
  <div id="review"></div>

  <h2>Waiting for you — questions</h2>
  <div id="questions"></div>

  <h2>Running on an assumption</h2>
  <div id="assumed"></div>

  <h2>Running now</h2>
  <div id="running"></div>

  <h2>Blocked</h2>
  <div id="blocked"></div>

  <h2>Categories</h2>
  <div class="row" id="cats"></div>

  <h2>Loop</h2>
  <div class="row">
    <button id="stop" class="danger">Stop the loop</button>
    <span class="meta">Takes effect next cycle. Anything running finishes.</span>
  </div>

  <footer>
    Refreshes every 3s. Answers go to <code>answers.jsonl</code> and are applied on the next cycle.
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

const post = (path, body) =>
  fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' },
                body: JSON.stringify(body) }).then(() => refresh())

const ago = (iso) => {
  if (!iso) return 'never'
  const s = Math.round((Date.now() - Date.parse(iso)) / 1000)
  if (s < 60) return s + 's ago'
  if (s < 3600) return Math.round(s / 60) + 'm ago'
  return Math.round(s / 3600) + 'h ago'
}

function render (s) {
  $('sub').textContent =
    `cycle ${s.cycle} · last beat ${ago(s.heartbeat?.at)} · ${s.counts.merged}/${s.counts.total} merged`

  const banners = []
  if (s.control.globalStop) {
    banners.push(`<div class="banner bad"><b>The loop is stopped.</b>
      Nothing will be dispatched. <button onclick="post('/api/control',{globalStop:false})">Resume</button></div>`)
  }
  if (s.stalled && !s.control.globalStop) {
    banners.push(`<div class="banner warn"><b>No heartbeat for over 50 minutes.</b>
      The cron job may not be running. Check <code>orchestration/state/runs/</code>.</div>`)
  }
  if (s.conflicts.length) {
    banners.push(`<div class="banner warn"><b>${s.conflicts.length} task(s) hit a merge conflict</b>
      and were set aside: ${s.conflicts.map(t => esc(t.id)).join(', ')}</div>`)
  }
  $('banners').innerHTML = banners.join('')

  const c = s.counts
  $('counts').innerHTML =
    `<span><b>${c.todo}</b> queued</span><span><b>${c.running}</b> running</span>
     <span><b>${c.prOpen}</b> in review</span><span><b>${c.merged}</b> merged</span>
     ${c.abandoned ? `<span><b>${c.abandoned}</b> abandoned</span>` : ''}`

  // Nothing merges without the owner, so this queue IS the bottleneck.
  $('review').innerHTML = s.awaitingReview.length ? s.awaitingReview.map(t => `
    <div class="card">
      <div class="row">
        <span class="title">${esc(t.title || t.id)}</span><span class="spacer"></span>
        ${t.pr ? `<a href="https://github.com/OrivonBrowser/orivon-mvp/pull/${t.pr}" target="_blank" rel="noopener">PR #${t.pr} →</a>` : ''}
      </div>
      <div class="meta"><span class="tag">${esc(t.category)}</span>
        <span class="tag">${esc(t.model)}</span>
        ${t.assumption ? '<span class="tag" style="background:var(--warn);color:#000">ASSUMED</span>' : ''}
        ${t.baseBranch && t.baseBranch !== 'main' ? `stacked on <code>${esc(t.baseBranch)}</code>` : ''}
      </div>
    </div>`).join('') : '<div class="empty">Nothing waiting. </div>'

  $('questions').innerHTML = s.openQuestions.length ? s.openQuestions.map(q => `
    <div class="card warn">
      <div class="title">${esc(q.question)}</div>
      <div class="meta">${esc(q.task || '')} · asked ${ago(q.asked)}</div>
      ${(q.options || []).map(o => `<div class="opt">• ${esc(o)}</div>`).join('')}
      ${q.aiRecommendation ? `<div class="rec"><b>Suggested:</b> ${esc(q.aiRecommendation)}</div>` : ''}
      ${q.whyItMatters ? `<div class="meta">Why it matters: ${esc(q.whyItMatters)}</div>` : ''}
      <textarea id="a-${esc(q.id)}" placeholder="Your answer — plain words are fine"></textarea>
      <button class="primary" onclick="answer('${esc(q.id)}')">Send answer</button>
    </div>`).join('') : '<div class="empty">No open questions.</div>'

  $('assumed').innerHTML = s.onAssumption.length ? s.onAssumption.map(t => `
    <div class="card warn">
      <div class="title">${esc(t.title || t.id)}</div>
      <div class="meta">Built on the assumed answer to <b>${esc(t.assumption)}</b>.
        Answering that question confirms or discards this work.</div>
    </div>`).join('') : '<div class="empty">Nothing is running on a guess.</div>'

  $('running').innerHTML = s.running.length ? s.running.map(t => `
    <div class="card">
      <div class="title">${esc(t.title || t.id)}</div>
      <div class="meta"><span class="tag">${esc(t.category)}</span><span class="tag">${esc(t.model)}</span></div>
    </div>`).join('') : '<div class="empty">Nothing running.</div>'

  $('blocked').innerHTML = s.blocked.length ? s.blocked.map(t => `
    <div class="card">
      <div class="title">${esc(t.title || t.id)}</div>
      <div class="meta">waiting on ${(t.blockedOn || []).map(esc).join(', ')}</div>
    </div>`).join('') : '<div class="empty">Nothing blocked.</div>'

  const paused = new Set(s.control.pausedCategories || [])
  $('cats').innerHTML = s.categories.map(cat => {
    const on = paused.has(cat)
    return `<button class="${on ? 'on' : ''}"
      onclick="post('/api/control', ${on ? `{resume:'${esc(cat)}'}` : `{pause:'${esc(cat)}'}`})">
      ${esc(cat)}${on ? ' — paused' : ''}</button>`
  }).join('')

  $('stop').textContent = s.control.globalStop ? 'Resume the loop' : 'Stop the loop'
  $('stop').onclick = () => post('/api/control', { globalStop: !s.control.globalStop })
}

function answer (id) {
  const el = $('a-' + id)
  if (!el || !el.value.trim()) return
  post('/api/answer', { id, answer: el.value })
}

async function refresh () {
  try {
    render(await (await fetch('/api/state')).json())
  } catch (e) {
    $('sub').textContent = 'panel unreachable — is the server still running?'
  }
}
refresh()
setInterval(refresh, 3000)
</script>
</body>
</html>
